name: Deploy msusuarios to VPS

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR (msusuarios)
        run: |
          mvn -q -DskipTests -f pom.xml clean package
        working-directory: .

      - name: Upload JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/msusuarios-*.jar"
          target: "/root/impulsofirme/backend/msusuarios/"
          overwrite: true

      - name: Restart msusuarios on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/impulsofirme/backend/msusuarios
            # Si por error app.jar era un directorio, elimínalo:
            [ -d app.jar ] && rm -rf app.jar
            # Deja exactamente un app.jar
            rm -f app.jar
            mv msusuarios-*.jar app.jar

            cd /root/impulsofirme
            # Variante sin build (montando app.jar con volumes):
            docker compose up -d msusuarios

            # Si usas Dockerfile que hace COPY app.jar, cambia por:
            # docker compose build msusuarios
            # docker compose up -d msusuarios

            # Mostrar logs de arranque
            docker logs msusuarios --tail=80