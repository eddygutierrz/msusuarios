name: Deploy msusuarios to VPS

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR (msusuarios)
        run: mvn -q -DskipTests clean package
        working-directory: .

      - name: Verificar artefactos
        run: |
          ls -lah
          ls -lah target || true

      - name: Upload JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/msusuarios.jar"
          target: "/root/impulsofirme/backend/msusuarios/"
          overwrite: true

      - name: Restart msusuarios on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/impulsofirme/backend/msusuarios
            [ -d app.jar ] && rm -rf app.jar
            rm -f app.jar
            mv msusuarios.jar app.jar
    
            cd /root/impulsofirme
            docker-compose up -d msusuarios
            docker logs msusuarios --tail=80