name: Deploy msusuarios to VPS

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR (msusuarios)
        run: |
          mvn -q -DskipTests -f pom.xml clean package
        working-directory: .

      # Sube el JAR ya construido al VPS como app.jar
      - name: Upload JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/msusuarios-*.jar"
          target: "/root/impulsofirme/backend/msusuarios/app.jar"
          overwrite: true

      # Reinicia SOLO el servicio msauth
      - name: Restart msauth on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/impulsofirme/backend/msusuarios
            rm -f app.jar
            mv msusuarios-*.jar app.jar

            cd /root/impulsofirme
            docker-compose up -d msusuarios
            docker logs msusuarios -f --tail 100